<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>
<form>

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" required minlength="3">
<br>
<br>    
    <label for="email">Email</label>
    <input type="text" id="email" required>
<br>
<br>
    <label for="password">Password</label>
    <input type="password" id="password" required minlength="8">
<br>
<br>
<label>Experience Level</label>

<input type="radio" id="beginner" name="level" value="beginner" required>
<label for="beginner">Beginner</label>

<input type="radio" id="intermediate" name="level" value="intermediate">
<label for="intermediate">Intermediate</label>

<br>
<br>

<input type="checkbox" id="agreement" required>
<label for="agreement">I agree to the terms</label>

<br>
<br>
<label for="country">Country</label>

<select id="country" required>
    <option value="">Select your country</option>
    <option value="jordan">Jordan</option>
    <option value="other">Other</option>
</select>

<br>
<br>

<label for="message">About You</label>
<textarea id="message" required minlength="10"></textarea>

</form>
</body>
</html>
